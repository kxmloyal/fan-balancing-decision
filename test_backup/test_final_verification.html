<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Verification - Real Rotational Speed Display</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="static/js/plotly-manager.js"></script>
    <script src="static/js/charts.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 30px 0; padding: 20px; border: 1px solid #eee; border-radius: 5px; }
        .chart-container { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 5px; }
        h2 { color: #333; }
        h3 { color: #666; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>最终验证 - 真实转速显示</h1>
    
    <!-- Test 1: Box Plot with Real Speed Values -->
    <div class="test-section">
        <h2>测试 1: 箱线图 - 真实转速值</h2>
        <div class="chart-container">
            <h3>箱线图 - P1面不平衡量</h3>
            <div id="test_box_chart" class="plotly-chart" 
                 data-chart-type="box" 
                 data-chart-title="P1面不平衡量箱线图" 
                 data-chart-color="#1f77b4"
                 data-chart-data='[{&quot;name&quot;: &quot;3000rpm&quot;, &quot;data&quot;: [1.0, 1.1, 1.2, 1.3, 1.4]}, {&quot;name&quot;: &quot;4000rpm&quot;, &quot;data&quot;: [2.3, 2.4, 2.5, 2.6, 2.7]}, {&quot;name&quot;: &quot;5000rpm&quot;, &quot;data&quot;: [1.6, 1.7, 1.8, 1.9, 2.0]}]'></div>
        </div>
    </div>
    
    <!-- Test 2: Trend Plot with Real Speed Values -->
    <div class="test-section">
        <h2>测试 2: 趋势图 - 真实转速值</h2>
        <div class="chart-container">
            <h3>趋势图 - P2面不平衡量</h3>
            <div id="test_trend_chart" class="plotly-chart" 
                 data-chart-type="trend" 
                 data-chart-title="P2面不平衡量趋势图" 
                 data-chart-color="#ff7f0e"
                 data-chart-data='[{&quot;name&quot;: &quot;3000rpm&quot;, &quot;value&quot;: 1.2}, {&quot;name&quot;: &quot;4000rpm&quot;, &quot;value&quot;: 2.5}, {&quot;name&quot;: &quot;5000rpm&quot;, &quot;value&quot;: 1.8}, {&quot;name&quot;: &quot;6000rpm&quot;, &quot;value&quot;: 3.2}]'></div>
        </div>
    </div>
    
    <!-- Test 3: Scatter Plot with Real Speed Values -->
    <div class="test-section">
        <h2>测试 3: 散点图 - 真实转速值</h2>
        <div class="chart-container">
            <h3>散点图 - ST面不平衡量</h3>
            <div id="test_scatter_chart" class="plotly-chart" 
                 data-chart-type="scatter" 
                 data-chart-title="ST面不平衡量散点图" 
                 data-chart-color="#2ca02c"
                 data-chart-data='[[&quot;3000rpm&quot;, 1.2], [&quot;3000rpm&quot;, 1.3], [&quot;4000rpm&quot;, 2.4], [&quot;4000rpm&quot;, 2.6], [&quot;5000rpm&quot;, 1.7], [&quot;5000rpm&quot;, 1.9]]'></div>
        </div>
    </div>
    
    <!-- Test 4: Violin Plot with Real Speed Values -->
    <div class="test-section">
        <h2>测试 4: 小提琴图 - 真实转速值</h2>
        <div class="chart-container">
            <h3>小提琴图 - P1面不平衡量</h3>
            <div id="test_violin_chart" class="plotly-chart" 
                 data-chart-type="violin" 
                 data-chart-title="P1面不平衡量小提琴图" 
                 data-chart-color="#9467bd"
                 data-chart-data='[{&quot;name&quot;: &quot;3000rpm&quot;, &quot;data&quot;: [1.0, 1.1, 1.2, 1.3, 1.4]}, {&quot;name&quot;: &quot;4000rpm&quot;, &quot;data&quot;: [2.3, 2.4, 2.5, 2.6, 2.7]}]'></div>
        </div>
    </div>
    
    <!-- Test 5: Multiple Speeds and Chart Types -->
    <div class="test-section">
        <h2>测试 5: 多转速值 - 综合验证</h2>
        <div class="chart-container">
            <h3>箱线图 - 多转速值</h3>
            <div id="test_multiple_speeds_chart" class="plotly-chart" 
                 data-chart-type="box" 
                 data-chart-title="多转速值箱线图" 
                 data-chart-color="#17becf"
                 data-chart-data='[{&quot;name&quot;: &quot;2000rpm&quot;, &quot;data&quot;: [0.5, 0.6, 0.7, 0.8, 0.9]}, {&quot;name&quot;: &quot;3000rpm&quot;, &quot;data&quot;: [1.0, 1.1, 1.2, 1.3, 1.4]}, {&quot;name&quot;: &quot;4000rpm&quot;, &quot;data&quot;: [2.3, 2.4, 2.5, 2.6, 2.7]}, {&quot;name&quot;: &quot;5000rpm&quot;, &quot;data&quot;: [1.6, 1.7, 1.8, 1.9, 2.0]}, {&quot;name&quot;: &quot;6000rpm&quot;, &quot;data&quot;: [3.0, 3.1, 3.2, 3.3, 3.4]}, {&quot;name&quot;: &quot;7000rpm&quot;, &quot;data&quot;: [1.9, 2.0, 2.1, 2.2, 2.3]}, {&quot;name&quot;: &quot;8000rpm&quot;, &quot;data&quot;: [3.3, 3.4, 3.5, 3.6, 3.7]}]'></div>
        </div>
    </div>
    
    <script>
        // Initialize charts when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM加载完成，初始化图表...');
            
            try {
                initAllChartFeatures();
                console.log('✅ 图表初始化成功');
                
                // Add verification messages
                setTimeout(function() {
                    const testSections = document.querySelectorAll('.test-section');
                    testSections.forEach((section, index) => {
                        const successMsg = document.createElement('div');
                        successMsg.className = 'success';
                        successMsg.innerHTML = `✅ 测试 ${index + 1} 完成：真实转速值已正确显示`;
                        section.appendChild(successMsg);
                    });
                }, 2000);
                
            } catch (error) {
                console.error('❌ 图表初始化失败:', error);
                const errorMsg = document.createElement('div');
                errorMsg.className = 'error';
                errorMsg.innerHTML = `❌ 初始化失败：${error.message}`;
                document.body.appendChild(errorMsg);
            }
        });
    </script>
</body>
</html>

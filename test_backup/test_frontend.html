<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Frontend Data Flow</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="static/js/plotly-manager.js"></script>
    <script src="static/js/charts.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .plotly-chart { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Test Frontend Data Flow</h1>
    
    <!-- Test box plot with actual speed data -->
    <div id="test_box_chart" class="plotly-chart" 
         data-chart-type="box" 
         data-chart-title="测试箱线图" 
         data-chart-color="#1f77b4"
         data-chart-data='[{"name": "3000rpm", "data": [1.0, 1.1, 1.2, 1.3, 1.4]}, {"name": "4000rpm", "data": [2.3, 2.4, 2.5, 2.6, 2.7]}, {"name": "5000rpm", "data": [1.6, 1.7, 1.8, 1.9, 2.0]}, {"name": "6000rpm", "data": [3.0, 3.1, 3.2, 3.3, 3.4]}, {"name": "7000rpm", "data": [1.9, 2.0, 2.1, 2.2, 2.3]}, {"name": "8000rpm", "data": [3.3, 3.4, 3.5, 3.6, 3.7]}]'></div>
    
    <!-- Test trend plot with actual speed data -->
    <div id="test_trend_chart" class="plotly-chart" 
         data-chart-type="trend" 
         data-chart-title="测试趋势图" 
         data-chart-color="#4caf50"
         data-chart-data='[{"name": "3000rpm", "value": 1.2}, {"name": "4000rpm", "value": 2.5}, {"name": "5000rpm", "value": 1.8}, {"name": "6000rpm", "value": 3.2}, {"name": "7000rpm", "value": 2.1}, {"name": "8000rpm", "value": 3.5}]'></div>
    
    <script>
        // Initialize charts when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, initializing charts...');
            initAllChartFeatures();
        });
    </script>
</body>
</html>

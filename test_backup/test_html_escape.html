<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test HTML Escape</title>
</head>
<body>
    <!-- Test with HTML-escaped JSON in data attribute -->
    <div id="test-container" 
         data-chart-data='[{&quot;name&quot;: &quot;3000rpm&quot;, &quot;data&quot;: [1.0, 1.1, 1.2, 1.3, 1.4]}]'></div>
    
    <script>
        // Test parsing
        const container = document.getElementById('test-container');
        const chartData = container.getAttribute('data-chart-data');
        
        console.log('Raw data from attribute:', chartData);
        
        try {
            const parsed = JSON.parse(chartData);
            console.log('Parsed successfully:', parsed);
        } catch (error) {
            console.error('Parsing failed:', error);
            
            // Try unescaping HTML entities
            const unescaped = chartData.replace(/&quot;/g, '"');
            console.log('Unescaped data:', unescaped);
            
            try {
                const parsedUnescaped = JSON.parse(unescaped);
                console.log('Parsed after unescaping:', parsedUnescaped);
            } catch (error2) {
                console.error('Unescaped parsing failed:', error2);
            }
        }
    </script>
</body>
</html>

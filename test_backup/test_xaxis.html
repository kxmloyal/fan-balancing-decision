<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X轴标签测试</title>
    <!-- 引入ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        .chart-container {
            width: 100%;
            height: 400px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">X轴标签测试</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>箱线图测试</h3>
                <div id="box-chart" class="chart-container"></div>
            </div>
            <div class="col-md-6">
                <h3>趋势图测试</h3>
                <div id="trend-chart" class="chart-container"></div>
            </div>
        </div>
    </div>
    
    <script>
        // 箱线图数据
        const boxData = [
            {"name":"3000rpm","data":[10,20,30,40,50]},
            {"name":"4000rpm","data":[15,25,35,45,55]},
            {"name":"5000rpm","data":[20,30,40,50,60]}
        ];
        
        // 趋势图数据
        const trendData = [
            {"name":"3000rpm","value":30},
            {"name":"4000rpm","value":35},
            {"name":"5000rpm","value":40},
            {"name":"6000rpm","value":45},
            {"name":"7000rpm","value":50}
        ];
        
        console.log('Box data:', boxData);
        console.log('Trend data:', trendData);
        
        // 初始化箱线图
        const boxChart = echarts.init(document.getElementById('box-chart'));
        const boxXAxisData = boxData.map(item => item.name);
        const boxSeriesData = boxData.map(item => item.data);
        
        console.log('Box xAxisData:', boxXAxisData);
        console.log('Box seriesData:', boxSeriesData);
        
        const boxOption = {
            title: {
                text: '箱线图测试',
                left: 'center'
            },
            tooltip: {
                trigger: 'item'
            },
            legend: {
                data: ['箱线图'],
                bottom: 10
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: boxXAxisData
            },
            yAxis: {
                type: 'value',
                name: '值'
            },
            series: [{
                name: '箱线图',
                type: 'boxplot',
                data: boxSeriesData
            }]
        };
        
        boxChart.setOption(boxOption);
        
        // 初始化趋势图
        const trendChart = echarts.init(document.getElementById('trend-chart'));
        const trendXAxisData = trendData.map(item => item.name);
        const trendSeriesData = trendData.map(item => item.value);
        
        console.log('Trend xAxisData:', trendXAxisData);
        console.log('Trend seriesData:', trendSeriesData);
        
        const trendOption = {
            title: {
                text: '趋势图测试',
                left: 'center'
            },
            tooltip: {
                trigger: 'axis'
            },
            legend: {
                data: ['趋势图'],
                bottom: 10
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: trendXAxisData
            },
            yAxis: {
                type: 'value',
                name: '值'
            },
            series: [{
                name: '趋势图',
                type: 'line',
                data: trendSeriesData
            }]
        };
        
        trendChart.setOption(trendOption);
        
        // 响应式调整
        window.addEventListener('resize', function() {
            boxChart.resize();
            trendChart.resize();
        });
    </script>
</body>
</html>

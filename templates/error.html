<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出错了 - 扇叶平衡补土转速评估工具</title>
    <link href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- 导入导航栏宏 -->
    {% import "macros/navbar.html" as navbar_macros %}
    
    <!-- 导航栏 -->
    {{ navbar_macros.render_navbar() }}
    
    <!-- 使用帮助模态框 -->
    {{ navbar_macros.render_help_modal() }}

    <!-- 错误页面容器（适配自定义CSS） -->
    <div class="container error-container">
        <div class="card d-inline-block p-5 shadow-lg">
            <h1 class="text-danger mb-4">
                <i class="bi bi-exclamation-triangle"></i> 操作失败
            </h1>
            <p class="text-muted fs-5 mb-5">{{ error_message }}</p>
            <!-- 统一风格的返回按钮 -->
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg px-6">
                <i class="bi bi-arrow-left"></i> 返回主页
            </a>
        </div>
    </div>

    <!-- 引入Bootstrap图标（增强视觉效果） -->
    <script src="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.js') }}"></script>
</body>
</html>

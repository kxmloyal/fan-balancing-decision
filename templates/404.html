<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 扇叶平衡补土转速评估工具</title>
    <!-- Bootstrap CSS -->
    <link href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 0;
        }
        .error-content {
            text-align: center;
            max-width: 600px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #dc3545;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 24px;
            margin-bottom: 30px;
            color: #6c757d;
        }
        .error-description {
            font-size: 16px;
            margin-bottom: 40px;
            color: #6c757d;
        }
        .btn-home {
            font-size: 18px;
            padding: 12px 30px;
        }
    </style>
</head>
<body>
    <!-- 导入导航栏宏 -->
    {% import "macros/navbar.html" as navbar_macros %}
    
    <!-- 导航栏 -->
    {{ navbar_macros.render_navbar(active_page='none') }}
    
    <!-- 使用帮助模态框 -->
    {{ navbar_macros.render_help_modal() }}

    <div class="error-container">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-message">{{ error_message }}</h1>
            <p class="error-description">
                您访问的页面不存在或已被移除。<br>
                请检查URL是否正确，或返回首页继续操作。
            </p>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-home">
                <i class="bi bi-house-door me-2"></i>
                返回首页
            </a>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="{{ url_for('static', filename='libs/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>

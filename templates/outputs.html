<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告管理 - 扇叶平衡补土转速评估工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='libs/bootstrap/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='libs/bootstrap-icons/bootstrap-icons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/outputs.css') }}">
    <script defer src="{{ url_for('static', filename='js/frontend-analytics.js') }}"></script>
</head>
<body>
    {% import "macros/navbar.html" as navbar_macros %}
    {{ navbar_macros.render_navbar(active_page='outputs') }}

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="rm-page">
        <div class="rm-hero">
            <div class="container">
                <div class="rm-hero-content">
                    <div class="rm-hero-info">
                        <h1 class="rm-hero-title">报告管理</h1>
                        <p class="rm-hero-subtitle">管理、预览和下载所有导出的分析报告</p>
                    </div>
                    <div class="rm-hero-actions">
                        <button class="btn btn-light btn-sm" id="btnSelectAll">
                            <i class="bi bi-check-all me-1"></i>全选
                        </button>
                        <button class="btn btn-light btn-sm" id="btnDeselectAll">
                            <i class="bi bi-x-circle me-1"></i>取消
                        </button>
                        <button class="btn btn-light btn-sm" id="btnInvertSelect">
                            <i class="bi bi-arrow-repeat me-1"></i>反选
                        </button>
                        <span class="text-white-50 mx-1">|</span>
                        <button class="btn btn-light btn-sm" id="btnCollapseAll">
                            <i class="bi bi-arrows-collapse me-1"></i>折叠
                        </button>
                        <button class="btn btn-light btn-sm" id="btnExpandAll">
                            <i class="bi bi-arrows-expand me-1"></i>展开
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="rm-stat-bar">
                <div class="rm-stat-card">
                    <div class="rm-stat-icon blue"><i class="bi bi-file-earmark-bar-graph"></i></div>
                    <div class="rm-stat-body">
                        <div class="rm-stat-value" id="statTotal">--</div>
                        <div class="rm-stat-label">报告总数</div>
                    </div>
                </div>
                <div class="rm-stat-card">
                    <div class="rm-stat-icon green"><i class="bi bi-diagram-3"></i></div>
                    <div class="rm-stat-body">
                        <div class="rm-stat-value" id="statModels">--</div>
                        <div class="rm-stat-label">型号数量</div>
                    </div>
                </div>
                <div class="rm-stat-card">
                    <div class="rm-stat-icon amber"><i class="bi bi-collection"></i></div>
                    <div class="rm-stat-body">
                        <div class="rm-stat-value" id="statTypes">--</div>
                        <div class="rm-stat-label">文件类型</div>
                    </div>
                </div>
                <div class="rm-stat-card">
                    <div class="rm-stat-icon purple"><i class="bi bi-clock-history"></i></div>
                    <div class="rm-stat-body">
                        <div class="rm-stat-value" id="statLatest">--</div>
                        <div class="rm-stat-label">最新报告</div>
                    </div>
                </div>
            </div>

            <div class="rm-model-nav" id="modelNavBar" style="display:none;">
                <span class="rm-model-nav-label"><i class="bi bi-funnel me-1"></i>快速筛选：</span>
                <div class="rm-model-nav-chips" id="modelNavChips"></div>
            </div>

            <div class="rm-toolbar">
                <div class="rm-toolbar-left">
                    <div class="rm-search-box">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" class="form-control rm-search-input" id="searchInput" placeholder="搜索文件名或型号...">
                    </div>
                    <div class="rm-filter-chips">
                        <span class="rm-filter-chip active" data-filter="all">全部</span>
                        <span class="rm-filter-chip" data-filter="html">HTML</span>
                        <span class="rm-filter-chip" data-filter="png">图片</span>
                        <span class="rm-filter-chip" data-filter="pdf">PDF</span>
                        <span class="rm-filter-chip" data-filter="xlsx">Excel</span>
                    </div>
                </div>
                <div class="rm-toolbar-right">
                    <button class="btn btn-sm btn-outline-secondary rm-view-toggle" id="viewToggleBtn" title="切换平铺/分组视图">
                        <i class="bi bi-grid-3x3-gap"></i> <span class="rm-view-toggle-label">分组</span>
                    </button>
                    <span class="rm-result-count" id="resultCount">加载中...</span>
                </div>
            </div>

            <div class="rm-model-groups" id="modelGroupsContainer">
                <div class="rm-loading">
                    <div class="spinner-border text-primary mb-3" role="status"></div>
                    <p class="text-muted">正在加载报告数据...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="rm-batch-bar" id="batchBar">
        <span>已选择 <strong id="batchCount">0</strong> 个文件</span>
        <button class="btn btn-light btn-sm" id="batchClearBtn">清除选择</button>
        <button class="btn btn-info btn-sm" id="batchDownloadBtn2">
            <i class="bi bi-file-zip me-1"></i>打包下载
        </button>
        <button class="btn btn-danger btn-sm" id="batchDeleteConfirmBtn">
            <i class="bi bi-trash me-1"></i>删除选中
        </button>
    </div>

    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="previewTitle">文件预览</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="previewBody">
                    <div class="text-center py-5">
                        <div class="spinner-border text-primary mb-3" role="status"></div>
                        <p class="mt-2 text-muted">正在加载预览...</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <a href="#" class="btn btn-primary" id="previewDownloadBtn" download>
                        <i class="bi bi-download me-1"></i>下载文件
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script defer src="{{ url_for('static', filename='js/safe-fetch.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/toast-helper.js') }}"></script>
    <script defer src="{{ url_for('static', filename='libs/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/outputs.js') }}"></script>
</body>
</html>
